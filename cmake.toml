[cmake]
version = "3.15"
cmkr-include = "cmake/cmkr.cmake"

[conditions]
linux = "CMAKE_SYSTEM_NAME STREQUAL \"Linux\""

[project]
name = "jaba"
languages = ["CXX"]
cmake-after = """
if(WIN32)
    enable_language(ASM_MASM)
endif()

# force a reconfigure (and re-run of cmkr's glob) whenever a file is added to or removed
# from src/, so new files get picked up without having to touch cmake.toml by hand
file(GLOB_RECURSE JABA_SOURCE_GLOB_CHECK CONFIGURE_DEPENDS "${CMAKE_CURRENT_SOURCE_DIR}/src/*.cpp" "${CMAKE_CURRENT_SOURCE_DIR}/src/*.hpp" "${CMAKE_CURRENT_SOURCE_DIR}/src/*.inl")
"""

[find-package.JNI]
condition = "linux"
required = true

[target.jaba]
type = "shared"
sources = [
    "src/**.cpp",
    "src/**.hpp",
    "src/**.inl",
]
windows.sources = [
    "src/hook/jaba_hk_stub.asm",
    "tests/*.cpp",
    "tests/util/*.cpp",
    "tests/util/*.hpp",
    "tests/java/*.hpp",
]
linux.sources = [
    "tests/linux/test.cpp",
]
include-directories = [
    "src",
    "tests",
    "vendor",
    "vendor/pe/include",
]
linux.include-directories = [
    "tests/linux/include",
    "${JNI_INCLUDE_DIRS}",
]
compile-features = ["cxx_std_23"]
windows.compile-options = ["$<$<COMPILE_LANGUAGE:CXX>:/Zc:preprocessor>"]
windows.link-libraries = ["${CMAKE_CURRENT_SOURCE_DIR}/vendor/jni/jvm.lib"]
linux.link-libraries = ["${CMAKE_DL_LIBS}"]
